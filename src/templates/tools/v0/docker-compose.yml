version: '3.8'

services:
  v0-app:
    build:
      context: ../
      dockerfile: .vibe-docker/Dockerfile
    container_name: {{PROJECT_NAME}}-v0
    ports:
      - "{{PORT}}:{{PORT}}"
    environment:
      - NODE_ENV=production
      - PORT={{PORT}}
      - HOSTNAME=0.0.0.0
      - NEXT_TELEMETRY_DISABLED=1
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - v0-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:{{PORT}}/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Optional: Mount for development
    # volumes:
    #   - ./.next:/app/.next:ro
    #   - ./public:/app/public:ro

networks:
  v0-network:
    driver: bridge
