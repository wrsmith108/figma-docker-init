version: '3.8'

services:
  lovable-app:
    build:
      context: ../
      dockerfile: .vibe-docker/Dockerfile
    container_name: {{PROJECT_NAME}}-lovable
    ports:
      - "{{PORT}}:{{PORT}}"
    environment:
      - NODE_ENV=production
      - VITE_SUPABASE_URL=${SUPABASE_URL}
      - VITE_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - PORT={{PORT}}
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - lovable-network
    # Security hardening
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp
      - /app/.cache
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:{{PORT}}/', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Local Supabase instance for development
  # Uncomment if not using Supabase Cloud
  # supabase-db:
  #   image: supabase/postgres:14.1.0
  #   container_name: {{PROJECT_NAME}}-supabase-db
  #   environment:
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-your-super-secret-password}
  #     POSTGRES_DB: postgres
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - supabase-db-data:/var/lib/postgresql/data
  #   networks:
  #     - lovable-network

networks:
  lovable-network:
    driver: bridge

