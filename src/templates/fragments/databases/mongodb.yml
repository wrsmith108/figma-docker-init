# MongoDB Database Fragment
# Composable docker-compose service for MongoDB
# Insertion Point: DATABASE_SERVICES

  mongodb:
    image: mongo:7-jammy
    container_name: {{PROJECT_NAME}}-mongodb
    restart: unless-stopped
    ports:
      - "{{MONGO_PORT:-27017}}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: {{MONGO_USER:-admin}}
      MONGO_INITDB_ROOT_PASSWORD: {{MONGO_PASSWORD:-admin}}
      MONGO_INITDB_DATABASE: {{MONGO_DB:-app_db}}
    volumes:
      - mongodb-data:/data/db
      - mongodb-config:/data/configdb
      - ./mongo-init:/docker-entrypoint-initdb.d:ro
    networks:
      - {{PROJECT_NAME}}-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    command: mongod --auth

  mongo-express:
    image: mongo-express:latest
    container_name: {{PROJECT_NAME}}-mongo-express
    restart: unless-stopped
    ports:
      - "{{MONGO_EXPRESS_PORT:-8081}}:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: {{MONGO_USER:-admin}}
      ME_CONFIG_MONGODB_ADMINPASSWORD: {{MONGO_PASSWORD:-admin}}
      ME_CONFIG_MONGODB_URL: mongodb://{{MONGO_USER:-admin}}:{{MONGO_PASSWORD:-admin}}@mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: {{MONGO_EXPRESS_USER:-admin}}
      ME_CONFIG_BASICAUTH_PASSWORD: {{MONGO_EXPRESS_PASSWORD:-admin}}
    depends_on:
      - mongodb
    networks:
      - {{PROJECT_NAME}}-network

volumes:
  mongodb-data:
    driver: local
  mongodb-config:
    driver: local
