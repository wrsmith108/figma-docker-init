services:
  # Development service with hot reload
  app-dev:
    image: node:18-alpine
    container_name: "{{PROJECT_NAME}}-dev"
    working_dir: /app
    ports:
      - "{{DEV_PORT}}:3000"
    volumes:
      # Mount source code for hot reload
      - ..:/app
      # Use named volume for node_modules
      - node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
      - VITE_HOST=0.0.0.0
      - VITE_PORT=3000
      - CHOKIDAR_USEPOLLING=true
      - NODE_OPTIONS=--max-old-space-size=4096
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3000"
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Production service using the local Dockerfile
  app-prod:
    build:
      context: ..
      dockerfile: .figma-docker/Dockerfile
      args:
        - NODE_ENV=production
    container_name: "{{PROJECT_NAME}}-prod"
    ports:
      - "{{PROD_PORT}}:80"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    profiles:
      - production

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: "{{PROJECT_NAME}}-nginx"
    ports:
      - "{{NGINX_PORT}}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ..:/usr/share/nginx/html:ro
    depends_on:
      - app-dev
    restart: unless-stopped
    networks:
      - app-network

volumes:
  node_modules:
    driver: local

networks:
  app-network:
    driver: bridge
